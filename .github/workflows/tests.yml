name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP checks
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Select main when starting a manual release.' >&2
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring
          coverage: none
          tools: phpunit:11
        env:
          fail-fast: true
      - name: Check PHP syntax
        run: find appinfo lib templates tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Run unit tests
        run: phpunit --configuration phpunit.xml.dist
      - name: Package and check AppDrop ZIP
        id: package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: appdrop-package
          path: dist/photo-gallery-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Draft release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: php
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: appdrop-package
          path: dist
      - name: Create draft release with AppDrop ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.php.outputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
              if [ "$tag_sha" != "$GITHUB_SHA" ]; then
                echo "Tag $RELEASE_TAG already points to another object; refusing to change it." >&2
                exit 1
              fi
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
            fi
          fi
          gh release create "$RELEASE_TAG" dist/photo-gallery-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft \
            --title "Photo Gallery ${RELEASE_TAG#v}" \
            --notes "Install the attached ZIP with AppDrop. Test this version and review these notes before publishing the release."
