name: Tests

on:
  workflow_call:
    outputs:
      release_tag:
        description: Version tag read from the packaged app
        value: ${{ jobs.php.outputs.release_tag }}
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP checks
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Select main when starting a manual release.' >&2
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring
          coverage: none
          tools: phpunit:11
        env:
          fail-fast: true
      - name: Check PHP syntax
        run: find appinfo lib templates tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Run unit tests
        run: phpunit --configuration phpunit.xml.dist
      - name: Package and check AppDrop ZIP
        id: package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: appdrop-package
          path: dist/photo-gallery-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

