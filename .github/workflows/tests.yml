name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring
          coverage: none
          tools: phpunit:11
        env:
          fail-fast: true
      - name: Check PHP syntax
        run: find appinfo lib templates tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Run unit tests
        run: phpunit --configuration phpunit.xml.dist
