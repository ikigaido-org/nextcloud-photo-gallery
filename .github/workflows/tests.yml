name: Tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring
          coverage: none
          tools: phpunit:11
        env:
          fail-fast: true
      - name: Check PHP syntax
        run: find appinfo lib templates tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Run unit tests
        run: phpunit --configuration phpunit.xml.dist
      - name: Package and check AppDrop ZIP
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: appdrop-package
          path: dist/photo-gallery-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: php
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: appdrop-package
          path: dist
      - name: Create draft release with AppDrop ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/photo-gallery-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft \
            --title "Photo Gallery ${RELEASE_TAG#v}" \
            --notes "Install the attached ZIP with AppDrop. Test this version and review these notes before publishing the release."
