name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks and package
    uses: ./.github/workflows/tests.yml

  release:
    name: Draft release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: appdrop-package
          path: dist
      - name: Create draft release with AppDrop ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
              if [ "$tag_sha" != "$GITHUB_SHA" ]; then
                echo "Tag $RELEASE_TAG already points to another object; refusing to change it." >&2
                exit 1
              fi
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
            fi
          fi
          gh release create "$RELEASE_TAG" dist/photo-gallery-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft \
            --title "Photo Gallery ${RELEASE_TAG#v}" \
            --notes "Install the attached ZIP with AppDrop. Test this version and review these notes before publishing the release."
